name: samui-news-tests

on:
  pull_request:
    paths:
      - "samui_news_*.py"
      - "main.py"
      - "main_legacy.py"
      - "tests/test_samui_news_*.py"
  push:
    branches: [main]
    paths:
      - "samui_news_*.py"
      - "main.py"
      - "main_legacy.py"
      - "tests/test_samui_news_*.py"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Samui News tests
        run: >
          python -m unittest
          tests.test_samui_news_event_dedup
          tests.test_samui_news_source_patch
          tests.test_samui_news_editorial_guard
          test_samui_news_publication_policy
