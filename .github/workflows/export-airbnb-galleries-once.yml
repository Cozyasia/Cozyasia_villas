name: Export Airbnb galleries 1201-1207

on:
  push:
    paths:
      - '.github/workflows/export-airbnb-galleries-once.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Export exact Airbnb galleries
        run: python tools/export_airbnb_gallery_action.py

      - name: Upload gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozy-airbnb-1201-1207
          path: photo_exports/
          compression-level: 6
          retention-days: 3
          if-no-files-found: error
